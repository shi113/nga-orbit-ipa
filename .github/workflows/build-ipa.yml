apk add --no-cache zip
git clone --depth 1 https://github.com/KiZmzz/nga-orbit-ios.git
cd nga-orbit-ios
python3 scripts/generate_project.py
xcodebuild \
  -project NGAReader.xcodeproj \
  -scheme NGAReader \
  -configuration Release \
  -destination 'generic/platform=iOS' \
  -derivedDataPath build \
  CODE_SIGNING_ALLOWED=NO \
  build
xcodebuild -exportArchive \
  -archivePath build/NGAReader.xcarchive \
  -exportPath . \
  -exportOptionsPlist /dev/null \
  -allowProvisioningDeviceRegistration YES \
  -provisioningStyle AdHoc
cd build && zip -r NGAOrbit-ipa.zip NGAReader.xcarchive/Products/Applications/*.app && cd ..
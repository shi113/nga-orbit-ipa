name: Build NGA Orbit IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: KiZmzz/nga-orbit-ios
          path: src

      - name: Install tools
        run: brew install zip

      - name: Generate Xcode project
        working-directory: src
        run: python3 scripts/generate_project.py

      - name: Build unsigned Release IPA
        working-directory: src
        run: |
          xcodebuild \
            -project NGAReader.xcodeproj \
            -scheme NGAReader \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ../DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          APP=$(find DerivedData/Build/Products -name 'NGAReader.app' -type d | head -n 1)
          mkdir Payload
          ditto "${APP}" Payload/NGAReader.app
          zip -qr NGA-Orbit-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: NGA-Orbit-unsigned
          path: NGA-Orbit-unsigned.ipa
          if-no-files-found: error

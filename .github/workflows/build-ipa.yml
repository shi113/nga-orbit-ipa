name: Build NGA Orbit IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout NGA Orbit
        uses: actions/checkout@v4
        with:
          repository: KiZmzz/nga-orbit-ios
          path: src

      - name: Show Xcode
        run: |
          xcodebuild -version
          xcode-select -p
          ls /Applications | grep -i xcode || true

      - name: Generate Xcode project
        working-directory: src
        run: python3 scripts/generate_project.py

      - name: Disable automatic signing
        working-directory: src
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("NGAReader.xcodeproj/project.pbxproj")
          text = p.read_text()
          text = text.replace('CODE_SIGN_STYLE = "Automatic"', 'CODE_SIGN_STYLE = "Manual"')
          p.write_text(text)
          print("patched CODE_SIGN_STYLE=Manual")
          PY

      - name: Build unsigned Release
        working-directory: src
        run: |
          set -o pipefail
          xcodebuild \
            -project NGAReader.xcodeproj \
            -scheme NGAReader \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$GITHUB_WORKSPACE/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM= \
            build | tee "$GITHUB_WORKSPACE/xcodebuild.log"

      - name: Package IPA
        run: |
          set -euo pipefail
          APP=$(find "$GITHUB_WORKSPACE/DerivedData" -name 'NGAReader.app' -type d | head -n 1)
          echo "APP=$APP"
          test -n "$APP"
          rm -rf Payload
          mkdir Payload
          ditto "$APP" Payload/NGAReader.app
          zip -qr NGA-Orbit-unsigned.ipa Payload
          ls -lh NGA-Orbit-unsigned.ipa
          unzip -l NGA-Orbit-unsigned.ipa | head -n 30

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: NGA-Orbit-unsigned
          path: NGA-Orbit-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore
